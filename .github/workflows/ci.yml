name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src/

      - name: Run tests
        run: pytest tests/ --maxfail=5 --disable-warnings

      - name: Build Docker image
        run: |
          docker build -t sentinel:latest .

      - name: Run sanity check (Streamlit)
        run: |
          docker run -d -p 8502:8502 sentinel:latest streamlit run src/sentinel/dashboard.py --server.port 8502
          sleep 10
          curl -s http://localhost:8502 || exit 1
          docker ps
