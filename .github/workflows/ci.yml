name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-runtime.txt
          pip install pytest httpx2
      - name: Run serving and dashboard tests
        run: python -m pytest -q tests/test_api.py tests/test_dashboard_navigation.py
      - name: Build Docker image
        run: docker build -t sentinel:ci .
      - name: Run health check
        run: |
          docker run -d --name ci_test -p 8000:8000 sentinel:ci
          for i in {1..30}; do
            curl --fail --silent http://localhost:8000/health > /tmp/sentinel-health.json && break || sleep 3
          done
          grep -q '"model_loaded":true' /tmp/sentinel-health.json
          curl --fail --silent --output /dev/null http://localhost:8501/
          docker logs ci_test > docs/evidence/docker_runtime_ci.txt
          docker rm -f ci_test
      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: docs/evidence/
